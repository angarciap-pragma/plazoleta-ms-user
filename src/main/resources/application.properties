spring.application.name=ms-user

spring.datasource.url=${USER_DATASOURCE_URL:jdbc:mysql://localhost:3306/ms_user}
spring.datasource.username=${USER_DATASOURCE_USERNAME:root}
spring.datasource.password=${USER_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8082}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
