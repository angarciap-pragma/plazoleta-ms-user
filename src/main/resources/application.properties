spring.application.name=ms-user

spring.datasource.url=${USER_DATASOURCE_URL:jdbc:mysql://localhost:3306/ms_user}
spring.datasource.username=${USER_DATASOURCE_USERNAME:root}
spring.datasource.password=${USER_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8082}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${AUTH_JWT_SECRET:plazoleta-auth-shared-secret-please-change-123456789}
security.jwt.issuer=${AUTH_JWT_ISSUER:plazoleta-auth}

user.bootstrap.admin.id=${USER_BOOTSTRAP_ADMIN_ID:1}
user.bootstrap.admin.first-name=${USER_BOOTSTRAP_ADMIN_FIRST_NAME:Platform}
user.bootstrap.admin.last-name=${USER_BOOTSTRAP_ADMIN_LAST_NAME:Admin}
user.bootstrap.admin.document-id=${USER_BOOTSTRAP_ADMIN_DOCUMENT_ID:100000001}
user.bootstrap.admin.phone-number=${USER_BOOTSTRAP_ADMIN_PHONE_NUMBER:+573000000001}
user.bootstrap.admin.birth-date=${USER_BOOTSTRAP_ADMIN_BIRTH_DATE:1990-01-01}
user.bootstrap.admin.email=${USER_BOOTSTRAP_ADMIN_EMAIL:admin@plazoleta.com}
user.bootstrap.admin.password=${USER_BOOTSTRAP_ADMIN_PASSWORD:Admin123*}

user.clients.restaurant-service.base-url=${RESTAURANT_SERVICE_BASE_URL:http://localhost:8083}
